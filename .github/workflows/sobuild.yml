name: Build Android .so Libraries

on:
  push:
    branches:
      - "**"
    paths:
      - "source/android/**"
      - ".github/workflows/sobuild.yml"
  pull_request:
    paths:
      - "source/android/**"
      - ".github/workflows/sobuild.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-so:
    name: Build Android .so (ARM & ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build with ndk-build
        run: |
          echo "Building ASILoader shared libraries for armeabi-v7a and arm64-v8a..."
          ndk-build -C source/android

      - name: Organize Artifacts
        run: |
          mkdir -p dist/armeabi-v7a dist/arm64-v8a
          cp source/android/libs/armeabi-v7a/libASILoader.so dist/armeabi-v7a/
          cp source/android/libs/arm64-v8a/libASILoader.so dist/arm64-v8a/
          ls -lh dist/armeabi-v7a/libASILoader.so dist/arm64-v8a/libASILoader.so

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-ASI-Loader-Android-libs
          path: dist/
          retention-days: 30
